<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Twitter Shop Pro | Account Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        /* ============================================================
           THEME — مینیمال، چشم‌نواز، بهینه
           ============================================================ */
        :root {
            --bg-body: #f2f6fc;
            --bg-container: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --bg-header: #ffffff;
            --bg-tab: #f1f5f9;
            --bg-filter: #f8fafc;
            --bg-stats: rgba(255, 255, 255, 0.6);
            --bg-admin: #f8fafc;
            --color-text: #0b1a2e;
            --color-text-dim: #2c3e50;
            --color-text-muted: #6b7a8a;
            --color-border: #e2eaf1;
            --color-accent: #d97706;
            --color-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
            --color-btn-gold: #d97706;
            --color-btn-green: #059669;
            --color-btn-purple: #7c3aed;
            --color-btn-blue: #2563eb;
            --color-btn-red: #dc2626;
            --color-toast-bg: #ffffff;
            --color-toast-text: #0f172a;
            --color-toast-border: #d97706;
            --color-toast-error-border: #ef4444;
            --color-loader-bg: #f2f6fc;
            --color-loader-title: #d97706;
            --color-loader-sub: #6b7a8a;
            --color-loader-track: rgba(0, 0, 0, 0.06);
            --color-loader-fill: #d97706;
            --radius-card: 1rem;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: var(--bg-body);
            min-height: 100vh;
            padding: 12px;
            color: var(--color-text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #e2eaf1;
        }
        ::-webkit-scrollbar-thumb {
            background: #d97706;
            border-radius: 4px;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            background: var(--bg-container);
            border-radius: 1.75rem;
            overflow: hidden;
            border: 1px solid var(--color-border);
            box-shadow: var(--color-shadow);
            padding: 0 0 20px 0;
        }

        /* ===== HEADER ===== */
        .header {
            background: var(--bg-header);
            padding: 0.9rem 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid var(--color-border);
            backdrop-filter: blur(4px);
        }
        .header h1 {
            color: #d97706;
            font-size: 1.5rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }
        .header h1 small {
            font-size: 0.55rem;
            color: #b45309;
            font-weight: 500;
            letter-spacing: 1px;
            opacity: 0.7;
        }
        .header h1 .pro-badge {
            font-size: 0.45rem;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            padding: 2px 10px;
            border-radius: 30px;
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 6px 16px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.7rem;
            letter-spacing: 0.2px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-gold {
            background: #d97706;
            color: #fff;
            box-shadow: 0 2px 8px rgba(217, 119, 6, 0.25);
        }
        .btn-gold:hover {
            background: #b45309;
            box-shadow: 0 4px 14px rgba(217, 119, 6, 0.35);
            transform: translateY(-1px);
        }
        .btn-purple {
            background: #7c3aed;
            color: #fff;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.25);
        }
        .btn-purple:hover {
            background: #6d28d9;
            transform: translateY(-1px);
        }
        .btn-red {
            background: #dc2626;
            color: #fff;
        }
        .btn-red:hover {
            background: #b91c1c;
        }
        .btn-green {
            background: #059669;
            color: #fff;
        }
        .btn-green:hover {
            background: #047857;
        }
        .btn-blue {
            background: #2563eb;
            color: #fff;
        }
        .btn-blue:hover {
            background: #1d4ed8;
        }
        .btn-x {
            background: #000000;
            color: #fff;
            border: 1px solid #1d9bf0;
        }
        .btn-x:hover {
            background: #1d9bf0;
            border-color: #1d9bf0;
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid rgba(217, 119, 6, 0.3);
            color: #d97706;
        }
        .btn-outline:hover {
            background: rgba(217, 119, 6, 0.06);
            border-color: #d97706;
        }
        .btn-sm {
            padding: 3px 10px;
            font-size: 0.55rem;
            border-radius: 20px;
        }
        .btn-danger {
            background: rgba(220, 38, 38, 0.08);
            border: 1px solid rgba(220, 38, 38, 0.2);
            color: #dc2626;
        }
        .btn-danger:hover {
            background: rgba(220, 38, 38, 0.15);
        }

        /* ===== SYNC STATUS ===== */
        .sync-status {
            background: var(--bg-tab);
            padding: 5px 18px;
            text-align: center;
            font-size: 0.5rem;
            color: var(--color-text-dim);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: center;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }
        .sync-status .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #059669;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.35;
                transform: scale(0.8);
            }
        }
        .sync-status .dot.offline {
            background: #dc2626;
            animation: none;
        }

        /* ===== STATS BAR ===== */
        .stats-bar {
            display: flex;
            gap: 14px;
            padding: 8px 18px;
            background: var(--bg-stats);
            border-bottom: 1px solid var(--color-border);
            flex-wrap: wrap;
            justify-content: space-around;
            backdrop-filter: blur(2px);
        }
        .stats-bar .stat-item {
            text-align: center;
            padding: 2px 8px;
        }
        .stats-bar .stat-item .stat-val {
            font-size: 1rem;
            font-weight: 800;
            color: #d97706;
            letter-spacing: -0.3px;
        }
        .stats-bar .stat-item .stat-label {
            font-size: 0.4rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 600;
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            display: flex;
            gap: 8px;
            padding: 8px 18px;
            flex-wrap: wrap;
            align-items: center;
            background: var(--bg-filter);
            border-bottom: 1px solid var(--color-border);
        }
        .filter-bar input,
        .filter-bar select {
            background: #ffffff;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            padding: 5px 10px;
            color: var(--color-text);
            font-size: 0.5rem;
            outline: none;
            transition: border var(--transition), box-shadow var(--transition);
            min-width: 60px;
        }
        .filter-bar input:focus,
        .filter-bar select:focus {
            border-color: #d97706;
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.08);
        }
        .filter-bar input::placeholder {
            color: var(--color-text-muted);
        }
        .filter-bar .btn {
            padding: 3px 10px;
            font-size: 0.45rem;
            border-radius: 20px;
        }
        .filter-bar .price-range {
            display: flex;
            gap: 4px;
            align-items: center;
            font-size: 0.45rem;
            color: var(--color-text-muted);
        }
        .filter-bar .price-range input {
            width: 44px;
            min-width: 34px;
            padding: 3px 6px;
            font-size: 0.45rem;
        }

        .shop-header {
            padding: 12px 18px 6px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .shop-header h2 {
            color: #d97706;
            font-size: 1.05rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.3px;
        }
        .shop-header .count-badge {
            background: rgba(217, 119, 6, 0.08);
            border: 1px solid rgba(217, 119, 6, 0.15);
            border-radius: 30px;
            padding: 1px 12px;
            font-size: 0.5rem;
            color: #d97706;
            font-weight: 600;
        }

        /* ===== SHOP GRID ===== */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
            gap: 12px;
            padding: 10px 18px 14px 18px;
        }

        .shop-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 16px;
            color: var(--color-text-muted);
        }
        .shop-empty .big-icon {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 8px;
            opacity: 0.3;
        }
        .shop-empty h3 {
            font-size: 0.95rem;
            color: var(--color-text-dim);
            margin-bottom: 4px;
        }
        .shop-empty p {
            font-size: 0.65rem;
            color: var(--color-text-muted);
        }

        /* ===== ACCOUNT CARD — چشم‌نواز و جمع‌وجور ===== */
        .account-card {
            border-radius: var(--radius-card);
            padding: 8px 8px 8px 8px;
            position: relative;
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            gap: 2px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            will-change: transform;
            overflow: hidden;
            min-height: 148px;
            background-size: cover;
            background-position: center;
            background-color: #f1f5f9;
            border: 1px solid var(--color-border);
            backdrop-filter: blur(2px);
        }
        .account-card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: #d97706;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
        }
        .account-card.featured {
            border-color: #7c3aed;
            background: linear-gradient(145deg, #ffffff 0%, #f5f3ff 100%);
        }
        .account-card.featured::after {
            content: '⭐ FEATURED';
            position: absolute;
            top: 5px;
            right: 5px;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            font-size: 0.3rem;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 12px;
            z-index: 5;
            letter-spacing: 0.4px;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.25);
        }

        .card-bg-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(2px);
            z-index: 0;
            border-radius: var(--radius-card);
            pointer-events: none;
            transition: background var(--transition);
        }
        .account-card:hover .card-bg-overlay {
            background: rgba(255, 255, 255, 0.45);
        }

        .card-bg-date {
            position: absolute;
            bottom: 3px;
            right: 8px;
            font-size: 1.9rem;
            font-weight: 900;
            color: rgba(0, 0, 0, 0.05);
            z-index: 0;
            pointer-events: none;
            line-height: 1;
            letter-spacing: -1.5px;
            white-space: nowrap;
            user-select: none;
            font-family: 'Arial Black', sans-serif;
        }

        .card-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 1px;
            flex: 1;
        }

        .account-card .card-top {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            z-index: 1;
        }
        .account-card .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            background: #e2e8f0;
            flex-shrink: 0;
            transition: transform var(--transition);
        }
        .account-card:hover .avatar {
            transform: scale(1.04);
        }
        .account-card .avatar-placeholder {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d97706, #b45309);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.6rem;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.95);
        }
        .account-card .username {
            font-size: 0.7rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 2px;
            flex-wrap: wrap;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            cursor: pointer;
            color: var(--color-text);
        }
        .account-card .username .at {
            color: var(--color-text-muted);
            font-weight: 400;
            font-size: 0.4rem;
        }
        .account-card .username .uname-link {
            color: var(--color-text);
            text-decoration: none;
            pointer-events: none;
        }
        .account-card .username .verified-badge {
            color: #2563eb;
            font-size: 0.5rem;
        }

        .account-card .followers {
            font-size: 0.45rem;
            color: var(--color-text-dim);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .account-card .followers strong {
            color: var(--color-text);
            font-weight: 700;
        }

        .account-card .price-row {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .account-card .price-tag {
            font-size: 0.85rem;
            font-weight: 800;
            color: #059669;
            letter-spacing: -0.3px;
        }
        .account-card .price-tag .currency {
            font-size: 0.4rem;
            color: var(--color-text-muted);
            font-weight: 400;
        }
        .account-card .price-tag.sale-price {
            color: #dc2626;
            text-decoration: line-through;
            font-size: 0.55rem;
            opacity: 0.5;
        }
        .account-card .price-tag.sale-new {
            color: #d97706;
            font-size: 0.75rem;
        }
        .account-card .sale-badge {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #fff;
            font-size: 0.3rem;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 10px;
            animation: pulse-sale 1.8s ease-in-out infinite;
        }
        @keyframes pulse-sale {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.06);
            }
        }

        .account-card .age-info {
            font-size: 0.35rem;
            color: var(--color-text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .account-card .age-info .label {
            color: var(--color-text-dim);
        }
        .account-card .age-info .age-value {
            color: #d97706;
            font-weight: 600;
        }

        .account-card .card-actions {
            display: flex;
            gap: 3px;
            margin-top: 2px;
            flex-wrap: wrap;
        }
        .account-card .card-actions .btn {
            flex: 1;
            justify-content: center;
            padding: 2px 4px;
            font-size: 0.4rem;
            min-width: 20px;
            border-radius: 14px;
        }

        .account-card .sold-badge {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(220, 38, 38, 0.92);
            color: #fff;
            padding: 1px 8px;
            border-radius: 12px;
            font-size: 0.35rem;
            font-weight: 700;
            z-index: 6;
            border: 1px solid rgba(220, 38, 38, 0.2);
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.2);
        }
        .account-card .sold-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(3px);
            z-index: 5;
            border-radius: var(--radius-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 900;
            color: #dc2626;
            letter-spacing: 0.5px;
        }
        .account-card .sold-overlay span {
            background: rgba(220, 38, 38, 0.06);
            padding: 3px 14px;
            border-radius: 30px;
            border: 2px solid rgba(220, 38, 38, 0.12);
        }
        .account-card .sold-timer {
            font-size: 0.35rem;
            color: #dc2626;
            opacity: 0.6;
            margin-top: 1px;
        }

        /* ===== ADMIN PANEL ===== */
        .admin-toggle-area {
            padding: 4px 18px;
            display: flex;
            justify-content: flex-end;
        }
        .admin-panel {
            background: var(--bg-admin);
            border: 1px solid rgba(220, 38, 38, 0.1);
            border-radius: 1.2rem;
            padding: 14px 18px;
            margin: 0 18px 12px 18px;
            display: none;
            animation: slideDown 0.3s ease;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.03);
        }
        .admin-panel.open {
            display: block;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .admin-panel h3 {
            color: #991b1b;
            font-size: 0.75rem;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(220, 38, 38, 0.08);
            padding-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
        }
        .admin-panel .form-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .admin-panel .form-row input,
        .admin-panel .form-row select {
            background: #ffffff;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            padding: 5px 12px;
            color: var(--color-text);
            font-size: 0.55rem;
            flex: 1;
            min-width: 60px;
            outline: none;
            transition: border var(--transition);
        }
        .admin-panel .form-row input:focus,
        .admin-panel .form-row select:focus {
            border-color: #d97706;
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.06);
        }
        .admin-panel .form-row input::placeholder {
            color: var(--color-text-muted);
        }
        .admin-panel .form-row .btn {
            flex: 0 1 auto;
            padding: 5px 14px;
            font-size: 0.55rem;
            border-radius: 20px;
        }
        .admin-panel .form-row select {
            min-width: 50px;
        }
        .admin-panel .form-row .checkbox-group {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 0.5rem;
            color: var(--color-text-dim);
        }
        .admin-panel .form-row .checkbox-group input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: #7c3aed;
            flex: 0;
            min-width: unset;
            cursor: pointer;
        }
        .admin-panel .admin-list {
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        .admin-panel .admin-list .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 8px;
            border-bottom: 1px solid var(--color-border);
            font-size: 0.5rem;
            color: var(--color-text-dim);
            flex-wrap: wrap;
            gap: 4px;
        }
        .admin-panel .admin-list .list-item .item-info {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .admin-panel .admin-list .list-item .item-info .uname {
            color: #d97706;
            font-weight: 700;
            font-size: 0.55rem;
        }
        .admin-panel .admin-list .list-item .item-info .uname a {
            color: #d97706;
            text-decoration: none;
        }
        .admin-panel .admin-list .list-item .item-info .uname a:hover {
            color: #2563eb;
            text-decoration: underline;
        }
        .admin-panel .admin-list .list-item .item-info .fcount {
            color: var(--color-text-dim);
            font-size: 0.45rem;
        }
        .admin-panel .admin-list .list-item .item-info .iprice {
            color: #059669;
            font-weight: 700;
            font-size: 0.5rem;
        }
        .admin-panel .admin-list .list-item .item-info .iage {
            color: var(--color-text-muted);
            font-size: 0.4rem;
        }
        .admin-panel .admin-list .list-item .item-info .ibadge {
            font-size: 0.4rem;
            padding: 1px 6px;
            border-radius: 8px;
        }
        .admin-panel .admin-list .list-item .item-info .ibadge.verified {
            background: rgba(37, 99, 235, 0.08);

    <script>
        // ============================================================
        //  CONFIG
        // ============================================================
        const SUPABASE_URL = 'https://tsuinkyntxlqtktnitbc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gfzNh_XxZSX55MkwldrFRw_f6GhCYHa';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const DATA_KEY = 'TWITTER_SHOP_PRO_DATA_V6';
        const ADMIN_PASSWORD = 'admin1313';
        const ADMIN_SESSION_KEY = 'TWITTER_SHOP_ADMIN_SESSION';
        const REDIRECT_URL = 'https://t.me/SiriAii';
        const AUTO_DELETE_MINUTES = 30;
        const SYNC_INTERVAL = 8000;

        // ============================================================
        //  STATE
        // ============================================================
        let accounts = [];
        let adminMode = false;
        let syncLoopRunning = false;
        let lastSyncHash = '';
        let isConnected = false;
        let filteredAccounts = [];
        let renderTimeout = null;

        // ============================================================
        //  HELPERS
        // ============================================================
        function toast(msg, type = '') {
            const el = document.createElement('div');
            el.className = 'toast' + (type ? ' ' + type : '');
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 4500);
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function formatNumber(n) {
            return Number(n).toLocaleString('en-US');
        }

        function fmtPrice(n) {
            const v = Number(n) || 0;
            if (Number.isInteger(v)) return '$' + v;
            return '$' + v.toFixed(2);
        }

        function ts() { return Date.now(); }

        function timeRemaining(soldAt) {
            const elapsed = ts() - soldAt;
            const remaining = AUTO_DELETE_MINUTES * 60 * 1000 - elapsed;
            if (remaining <= 0) return '0s';
            const mins = Math.floor(remaining / 60000);
            const secs = Math.floor((remaining % 60000) / 1000);
            if (mins > 0) return mins + 'm ' + secs + 's';
            return secs + 's';
        }

        function getAccountAge(accountCreatedAt) {
            if (!accountCreatedAt) return { display: 'N/A', raw: 0 };
            const now = ts();
            const diff = now - accountCreatedAt;
            if (diff < 0) return { display: '0s', raw: 0 };
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            const months = Math.floor(days / 30);
            const years = Math.floor(days / 365);
            let display = '';
            if (years > 0) display += years + 'y ';
            if (months > 0 && years < 2) display += (months % 12) + 'mo ';
            if (days > 0 && years === 0) display += days + 'd ';
            if (hours > 0 && days === 0) display += (hours % 24) + 'h ';
            if (minutes > 0 && hours === 0 && days === 0) display += (minutes % 60) + 'm ';
            if (seconds > 0 && minutes === 0 && hours === 0 && days === 0) display += seconds + 's';
            if (!display) display = '0s';
            return { display: display.trim(), raw: diff };
        }

        function formatDate(tsVal) {
            if (!tsVal) return 'Unknown';
            const d = new Date(tsVal);
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function formatYear(tsVal) {
            if (!tsVal) return '';
            return new Date(tsVal).getFullYear().toString();
        }

        function toTimestampFromMonthYear(month, year) {
            if (!month || !year) return ts();
            const d = new Date(Date.UTC(parseInt(year), parseInt(month) - 1, 1));
            return d.getTime();
        }

        function populateYearDropdown() {
            const sel = document.getElementById('adminYear');
            if (!sel) return;
            const currentYear = new Date().getFullYear();
            sel.innerHTML = '<option value="">Year</option>';
            for (let y = currentYear; y >= 2006; y--) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                sel.appendChild(opt);
            }
        }

        function checkOnX(username) {
            if (!username) return;
            const target = 'https://x.com/' + username;
            if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.openLink === 'function') {
                try { window.Telegram.WebApp.openLink(target); return; } catch (e) { /* fallthrough */ }
            }
            try {
                const a = document.createElement('a');
                a.href = target;
                a.target = '_blank';
                a.rel = 'noopener,noreferrer';
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                return;
            } catch (e) { /* fallthrough */ }
            try { window.location.replace(target); } catch (err) { window.location.href = target; }
        }

        // ===== RATINGS حذف شد =====
        function getFinalPrice(acc) {
            return acc.sale_price !== null && acc.sale_price !== undefined && acc.sale_price > 0 ? acc.sale_price : acc
                .price || 0;
        }

        // ===== تصاویر =====
        function getAvatarUrl(username) {
            return 'https://unavatar.io/twitter/' + encodeURIComponent(username) + '?fallback=false';
        }

        function getBannerUrl(username) {
            return 'https://unavatar.io/twitter/' + encodeURIComponent(username) + '/banner';
        }

        function getUsernameGradient(username) {
            let hash = 0;
            for (let i = 0; i < username.length; i++) {
                hash = username.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue1 = Math.abs(hash % 360);
            const hue2 = (hue1 + 50) % 360;
            return `linear-gradient(135deg, hsl(${hue1}, 65%, 78%) 0%, hsl(${hue2}, 65%, 68%) 100%)`;
        }

        // ============================================================
        //  SUPABASE
        // ============================================================
        async function loadShopData() {
            try {
                let { data, error } = await db
                    .from('game_state')
                    .select('data')
                    .eq('id', 'main_game')
                    .maybeSingle();
                if (error && error.code !== 'PGRST116') throw error;
                if (!data) {
                    await db.from('game_state').insert({ id: 'main_game', data: { k: DATA_KEY, accounts: [] } });
                    accounts = [];
                    isConnected = true;
                    return true;
                }
                const rawData = data.data;
                if (rawData && rawData.k === DATA_KEY) {
                    accounts = rawData.accounts || [];
                } else {
                    accounts = [];
                }
                let changed = false;
                accounts.forEach(acc => {
                    if (!acc.account_created_at) { acc.account_created_at = acc.created_at || ts();
                        changed = true; }
                    if (!acc.created_at) { acc.created_at = ts();
                        changed = true; }
                    if (acc.verified === undefined) { acc.verified = false;
                        changed = true; }
                    if (acc.featured === undefined) { acc.featured = false;
                        changed = true; }
                    if (acc.sale_price === undefined) { acc.sale_price = null;
                        changed = true; }
                    if (acc.ratings !== undefined) { delete acc.ratings;
                        changed = true; }
                });
                const now = ts();
                accounts = accounts.filter(acc => {
                    if (acc.sold && acc.sold_at && (now - acc.sold_at) > AUTO_DELETE_MINUTES * 60 * 1000) {
                        changed = true;
                        return false;
                    }
                    return true;
                });
                if (changed) await saveShopData();
                isConnected = true;
                return true;
            } catch (e) {
                console.error('loadShopData error:', e);
                isConnected = false;
                return false;
            }
        }

        async function saveShopData() {
            try {
                accounts.forEach(acc => { if (acc.ratings) delete acc.ratings; });
                const payload = { k: DATA_KEY, accounts: accounts };
                const { error } = await db
                    .from('game_state')
                    .upsert({ id: 'main_game', data: payload }, { onConflict: 'id' });
                if (error) throw error;
                return true;
            } catch (e) {
                console.error('saveShopData error:', e);
                return false;
            }
        }

        // ============================================================
        //  CRUD
        // ============================================================
        async function addAccount(username, followers, price, accountCreatedAt, verified, featured) {
            const newAcc = {
                id: 'acc_' + ts() + '_' + Math.random().toString(36).substr(2, 4),
                username: username.trim(),
                followers: parseInt(followers) || 0,
                price: parseFloat(price) || 0,
                sold: false,
                sold_at: null,
                created_at: ts(),
                account_created_at: accountCreatedAt || ts(),
                verified: !!verified,
                featured: !!featured,
                sale_price: null,
            };
            accounts.unshift(newAcc);
            const ok = await saveShopData();
            if (ok) return newAcc;
            accounts = accounts.filter(a => a.id !== newAcc.id);
            return null;
        }

        async function editAccount(id, updates) {
            const acc = accounts.find(a => a.id === id);
            if (!acc) return false;
            Object.assign(acc, updates);
            const ok = await saveShopData();
            if (!ok) { await loadShopData(); return false; }
            return true;
        }

        async function toggleVerified(id) {
            const acc = accounts.find(a => a.id === id);
            if (!acc) return false;
            acc.verified = !acc.verified;
            const ok = await saveShopData();
            if (!ok) { acc.verified = !acc.verified; return false; }
            return true;
        }

        async function toggleFeatured(id) {
            const acc = accounts.find(a => a.id === id);
            if (!acc) return false;
            acc.featured = !acc.featured;
            const ok = await saveShopData();
            if (!ok) { acc.featured = !acc.featured; return false; }
            return true;
        }

        async function setSalePrice(id, salePrice) {
            const acc = accounts.find(a => a.id === id);
            if (!acc) return false;
            acc.sale_price = salePrice !== null && salePrice >= 0 ? parseFloat(salePrice) : null;
            const ok = await saveShopData();
            if (!ok) { acc.sale_price = null; return false; }
            return true;
        }

        async function markSold(id) {
            const acc = accounts.find(a => a.id === id);
            if (!acc || acc.sold) return false;
            acc.sold = true;
            acc.sold_at = ts();
            const ok = await saveShopData();
            if (!ok) { acc.sold = false;
                acc.sold_at = null; return false; }
            return true;
        }

        async function deleteAccount(id) {
            const idx = accounts.findIndex(a => a.id === id);
            if (idx === -1) return false;
            const removed = accounts.splice(idx, 1);
            const ok = await saveShopData();
            if (!ok) { accounts.splice(idx, 0, removed[0]); return false; }
            return true;
        }

        // ============================================================
        //  FILTERS
        // ============================================================
        function applyFilters() {
            const search = document.getElementById('filterSearch').value.toLowerCase().trim();
            const sort = document.getElementById('filterSort').value;
            const status = document.getElementById('filterStatus').value;
            const verified = document.getElementById('filterVerified').value;
            const sale = document.getElementById('filterSale').value;
            const priceMin = parseFloat(document.getElementById('priceMin').value) || 0;
            const priceMax = parseFloat(document.getElementById('priceMax').value) || Infinity;

            filteredAccounts = accounts.filter(acc => {
                if (status === 'available' && acc.sold) return false;
                if (status === 'sold' && !acc.sold) return false;
                if (verified === 'verified' && !acc.verified) return false;
                if (verified === 'unverified' && acc.verified) return false;
                if (sale === 'sale' && (acc.sale_price === null || acc.sale_price === undefined)) return false;
                if (search && !acc.username.toLowerCase().includes(search)) return false;
                const price = getFinalPrice(acc);
                if (price < priceMin) return false;
                if (priceMax < Infinity && price > priceMax) return false;
                return true;
            });

            filteredAccounts.sort((a, b) => {
                switch (sort) {
                    case 'newest':
                        return b.created_at - a.created_at;
                    case 'oldest':
                        return a.created_at - b.created_at;
                    case 'price-asc':
                        return getFinalPrice(a) - getFinalPrice(b);
                    case 'price-desc':
                        return getFinalPrice(b) - getFinalPrice(a);
                    case 'followers-desc':
                        return b.followers - a.followers;
                    case 'followers-asc':
                        return a.followers - b.followers;
                    default:
                        return 0;
                }
            });

            if (renderTimeout) cancelAnimationFrame(renderTimeout);
            renderTimeout = requestAnimationFrame(() => {
                renderShop();
                updateStats();
                renderTimeout = null;
            });
        }

        function resetFilters() {
            document.getElementById('filterSearch').value = '';
            document.getElementById('filterSort').value = 'newest';
            document.getElementById('filterStatus').value = 'all';
            document.getElementById('filterVerified').value = 'all';
            document.getElementById('filterSale').value = 'all';
            document.getElementById('priceMin').value = '';
            document.getElementById('priceMax').value = '';
            applyFilters();
        }

        // ============================================================
        //  STATS
        // ============================================================
        function updateStats() {
            const total = accounts.length;
            const available = accounts.filter(a => !a.sold).length;
            const prices = accounts.filter(a => !a.sold).map(a => getFinalPrice(a));
            const avgPrice = prices.length ? (prices.reduce((s, p) => s + p, 0) / prices.length) : 0;
            const maxFollowers = accounts.reduce((max, a) => Math.max(max, a.followers), 0);
            const verified = accounts.filter(a => a.verified).length;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statAvailable').textContent = available;
            document.getElementById('statAvgPrice').textContent = fmtPrice(avgPrice);
            document.getElementById('statMaxFollowers').textContent = formatNumber(maxFollowers);
            document.getElementById('statVerified').textContent = verified;
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function renderShop() {
            const grid = document.getElementById('shopGrid');
            const display = filteredAccounts.length ? filteredAccounts : accounts;
            const live = display.filter(a => !a.sold);

            if (display.length === 0) {
                grid.innerHTML = `
                    <div class="shop-empty">
                        <span class="big-icon">📭</span>
                        <h3>No accounts found</h3>
                        <p>Try adjusting your filters</p>
                    </div>
                `;
                document.getElementById('liveCount').textContent = '0';
                return;
            }

            const fragment = document.createDocumentFragment();
            display.forEach(acc => {
                const card = createCardElement(acc);
                fragment.appendChild(card);
            });

            grid.innerHTML = '';
            grid.appendChild(fragment);
            document.getElementById('liveCount').textContent = live.length;
        }

        function createCardElement(acc) {
            const isSold = acc.sold;
            const username = escapeHtml(acc.username);
            const followers = formatNumber(acc.followers);
            const finalPrice = getFinalPrice(acc);
            const originalPrice = acc.price || 0;
            const isSale = acc.sale_price !== null && acc.sale_price !== undefined && acc.sale_price > 0 && !isSold;
            const age = getAccountAge(acc.account_created_at);
            const createdDate = formatDate(acc.account_created_at);
            const yearOnly = formatYear(acc.account_created_at);

            const avatarUrl = getAvatarUrl(acc.username);
            const bannerUrl = getBannerUrl(acc.username);
            const fallbackGradient = getUsernameGradient(acc.username);

            const card = document.createElement('div');
            card.className = 'account-card' + (acc.featured && !isSold ? ' featured' : '');
            card.dataset.id = acc.id;

            card.style.backgroundImage = `url('${bannerUrl}'), ${fallbackGradient}`;
            card.style.backgroundSize = 'cover, cover';
            card.style.backgroundPosition = 'center, center';
            card.style.backgroundColor = '#f1f5f9';

            const overlay = document.createElement('div');
            overlay.className = 'card-bg-overlay';

            const bgDate = document.createElement('div');
            bgDate.className = 'card-bg-date';
            bgDate.textContent = yearOnly || '';

            const content = document.createElement('div');
            content.className = 'card-content';

            let priceHtml = '';
            if (isSale) {
                priceHtml = `
                    <span class="price-tag sale-price">${fmtPrice(originalPrice)}</span>
                    <span class="price-tag sale-new">${fmtPrice(finalPrice)}</span>
                `;
            } else {
                priceHtml = `<span class="price-tag">${fmtPrice(finalPrice)}</span>`;
            }

            let soldHtml = '';
            if (isSold) {
                const remaining = acc.sold_at ? timeRemaining(acc.sold_at) : '0s';
                soldHtml = `
                    <div class="sold-badge">Sold</div>
                    <div class="sold-overlay"><span>⛔ Sold</span></div>
                    <div class="sold-timer">⏳ ${remaining}</div>
                `;
            }

            let actionButtons = '';
            if (isSold) {
                actionButtons = `
                    <button class="btn btn-x" style="flex:1;justify-content:center;" onclick="checkOnX('${username}')" title="View @${username} on X">🐦 Check on X</button>
                    <button class="btn btn-danger btn-sm" style="flex:0.5;justify-content:center;" disabled>⛔ Sold</button>
                `;
            } else {
                actionButtons = `
                    <button class="btn btn-gold" style="flex:1;justify-content:center;" onclick="buyAccount('${acc.id}')">Buy</button>
                    <button class="btn btn-x" style="flex:1;justify-content:center;" onclick="checkOnX('${username}')" title="View @${username} on X">🐦 Check on X</button>
                `;
            }

            let adminButtons = '';
            if (adminMode) {
                adminButtons = `
                    <button class="btn btn-red btn-sm" onclick="adminDelete('${acc.id}')" style="flex:0.3;justify-content:center;">🗑️</button>
                    ${!isSold ? `<button class="btn btn-purple btn-sm" onclick="adminMarkSold('${acc.id}')" style="flex:0.3;justify-content:center;">💰</button>` : ''}
                    ${!isSold ? `<button class="btn btn-blue btn-sm" onclick="adminToggleVerified('${acc.id}')" style="flex:0.3;justify-content:center;font-size:0.4rem;">${acc.verified ? '✅' : '⬜'}</button>` : ''}
                    ${!isSold ? `<button class="btn btn-sm ${acc.featured ? 'btn-gold' : 'btn-outline'}" onclick="adminToggleFeatured('${acc.id}')" style="flex:0.3;justify-content:center;font-size:0.4rem;padding:1px 3px;">${acc.featured ? '⭐' : '☆'}</button>` : ''}
                    ${!isSold ? `<button class="btn btn-sm btn-green" onclick="adminSetSale('${acc.id}')" style="flex:0.3;justify-content:center;font-size:0.4rem;padding:1px 3px;">🏷️</button>` : ''}
                `;
            }

            const avatarHtml = `
                <div style="display:flex;align-items:center;gap:5px;margin-bottom:1px;">
                    <img src="${avatarUrl}" alt="@${username}" class="avatar" 
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                    <div class="avatar-placeholder" style="display:none;">${username.charAt(0).toUpperCase()}</div>
                    <span class="username">
                        <span class="at">@</span>
                        <span class="uname-link">${username}</span>
                        ${acc.verified && !isSold ? `<span class="verified-badge">✅</span>` : ''}
                    </span>
                </div>
            `;

            content.innerHTML = `
                ${soldHtml}
                <div class="card-top">
                    ${avatarHtml}
                </div>
                <div class="followers">👥 <strong>${followers}</strong></div>
                <div class="price-row">
                    ${priceHtml}
                    ${isSale ? `<span class="sale-badge">🔥</span>` : ''}
                </div>
                <div class="age-info">
                    <span class="label">📅</span>
                    <span class="age-value">${createdDate}</span>
                    <span class="label">🕒</span>
                    <span class="age-value">${age.display}</span>
                </div>
                <div class="card-actions">
                    ${actionButtons}
                    ${adminButtons}
                </div>
            `;

            card.appendChild(overlay);
            card.appendChild(bgDate);
            card.appendChild(content);

            return card;
        }

        function renderAdminList() {
            const container = document.getElementById('adminList');
            if (accounts.length === 0) {
                container.innerHTML =
                    '<div style="text-align:center;padding:8px;color:var(--color-text-muted);font-size:0.5rem;">No accounts</div>';
                return;
            }
            let html = '';
            for (const acc of accounts) {
                const status = acc.sold ? '🔴' : '🟢';
                const soldTime = acc.sold_at ? timeRemaining(acc.sold_at) : '—';
                const age = getAccountAge(acc.account_created_at);
                const finalPrice = getFinalPrice(acc);
                const badges = [];
                if (acc.verified) badges.push('<span class="ibadge verified">✅</span>');
                if (acc.featured) badges.push('<span class="ibadge featured">⭐</span>');
                if (acc.sale_price !== null && acc.sale_price !== undefined) badges.push('<span class="ibadge sale">🔥</span>');
                html += `
                    <div class="list-item">
                        <div class="item-info">
                            <span class="uname" style="-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;">@${escapeHtml(acc.username)}</span>
                            <button class="btn btn-x btn-sm" onclick="checkOnX('${escapeHtml(acc.username)}')" style="font-size:0.35rem;padding:1px 6px;">🐦</button>
                            <span class="fcount">👥 ${formatNumber(acc.followers)}</span>
                            <span class="iprice">${fmtPrice(finalPrice)}</span>
                            <span class="iage">🕒 ${age.display}</span>
                            ${badges.join(' ')}
                            <span style="font-size:0.45rem;">${status}</span>
                            ${acc.sold ? `<span style="font-size:0.35rem;color:#dc2626;">⏳ ${soldTime}</span>` : ''}
                        </div>
                        <div class="item-actions">
                            ${!acc.sold ? `<button class="btn btn-purple btn-sm" onclick="adminMarkSold('${acc.id}')">💰</button>` : ''}
                            <button class="btn btn-red btn-sm" onclick="adminDelete('${acc.id}')">🗑️</button>
                            <button class="btn btn-blue btn-sm" onclick="adminToggleVerified('${acc.id}')">${acc.verified ? '✅' : '⬜'}</button>
                            <button class="btn btn-sm ${acc.featured ? 'btn-gold' : 'btn-outline'}" onclick="adminToggleFeatured('${acc.id}')" style="font-size:0.35rem;">${acc.featured ? '⭐' : '☆'}</button>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // ============================================================
        //  UI ACTIONS
        // ============================================================
        function openAdminPanel() {
            if (sessionStorage.getItem(ADMIN_SESSION_KEY) === '1') {
                adminMode = true;
                showAdminPanel();
                return;
            }
            const pw = prompt('🔐 Enter admin password:');
            if (pw === null) return;
            if (pw !== ADMIN_PASSWORD) {
                toast('Incorrect password', 'error');
                return;
            }
            sessionStorage.setItem(ADMIN_SESSION_KEY, '1');
            adminMode = true;
            showAdminPanel();
        }

        function closeAdminPanel() {
            adminMode = false;
            sessionStorage.removeItem(ADMIN_SESSION_KEY);
            hideAdminPanel();
        }

        function showAdminPanel() {
            const panel = document.getElementById('adminPanel');
            const btn = document.getElementById('adminToggleBtn');
            const btn2 = document.getElementById('adminToggleBtn2');
            if (panel) panel.classList.add('open');
            if (btn) btn.textContent = '🔒 Close';
            if (btn2) { btn2.style.display = 'inline-flex'; btn2.textContent = '🔒 Close Admin'; }
            renderAdminList();
            applyFilters();
        }

        function hideAdminPanel() {
            const panel = document.getElementById('adminPanel');
            const btn = document.getElementById('adminToggleBtn');
            const btn2 = document.getElementById('adminToggleBtn2');
            if (panel) panel.classList.remove('open');
            if (btn) btn.textContent = '🔑 Admin';
            if (btn2) { btn2.style.display = 'none'; btn2.textContent = '🔒 Close Admin'; }
            applyFilters();
        }

        function toggleAdminPanel() {
            if (adminMode) {
                closeAdminPanel();
            } else {
                openAdminPanel();
            }
        }
        window.toggleAdminPanel = toggleAdminPanel;
        window.openAdminPanel = openAdminPanel;
        window.closeAdminPanel = closeAdminPanel;
        window.showAdminPanel = showAdminPanel;
        window.hideAdminPanel = hideAdminPanel;

        window.adminAddAccount = async function() {
            const username = document.getElementById('adminUsername').value.trim();
            const followers = document.getElementById('adminFollowers').value.trim();
            const price = document.getElementById('adminPrice').value.trim();
            const month = document.getElementById('adminMonth').value;
            const year = document.getElementById('adminYear').value;
            const verified = document.getElementById('adminVerified').checked;
            const featured = document.getElementById('adminFeatured').checked;

            if (!username) return toast('Enter username', 'error');
            if (!followers || parseInt(followers) < 0) return toast('Invalid followers', 'error');
            if (!price || parseFloat(price) < 0) return toast('Invalid price', 'error');

            let accountCreatedAt = ts();
            if (month && year) accountCreatedAt = toTimestampFromMonthYear(month, year);

            const result = await addAccount(username, followers, price, accountCreatedAt, verified, featured);
            if (result) {
                document.getElementById('adminUsername').value = '';
                document.getElementById('adminFollowers').value = '';
                document.getElementById('adminPrice').value = '';
                document.getElementById('adminMonth').value = '';
                document.getElementById('adminYear').value = '';
                document.getElementById('adminVerified').checked = false;
                document.getElementById('adminFeatured').checked = false;
                toast(`✅ @${username} added`, 'success');
                applyFilters();
                renderAdminList();
                updateStats();
                updateSyncUI();
            } else {
                toast('❌ Error', 'error');
            }
        };

        window.adminEditAccount = async function() {
            const id = document.getElementById('adminEditId').value.trim();
            const newPrice = document.getElementById('adminEditPrice').value.trim();
            const newFollowers = document.getElementById('adminEditFollowers').value.trim();

            if (!id) return toast('Enter account ID', 'error');

            const acc = accounts.find(a => a.id === id);
            if (!acc) return toast('Account not found', 'error');

            const updates = {};
            if (newPrice) updates.price = parseFloat(newPrice);
            if (newFollowers) updates.followers = parseInt(newFollowers);

            if (Object.keys(updates).length === 0) return toast('No changes', 'error');

            const ok = await editAccount(id, updates);
            if (ok) {
                document.getElementById('adminEditId').value = '';
                document.getElementById('adminEditPrice').value = '';
                document.getElementById('adminEditFollowers').value = '';
                toast(`✅ @${acc.username} updated`, 'success');
                applyFilters();
                renderAdminList();
                updateStats();
                updateSyncUI();
            } else {
                toast('❌ Error', 'error');
            }
        };

        window.adminToggleVerified = async function(id) {
            const ok = await toggleVerified(id);
            if (ok) { toast('✅ Toggled', 'success');
                applyFilters();
                renderAdminList();
                updateStats(); } else toast('❌ Error', 'error');
        };

        window.adminToggleFeatured = async function(id) {
            const ok = await toggleFeatured(id);
            if (ok) { toast('⭐ Toggled', 'success');
                applyFilters();
                renderAdminList(); } else toast('❌ Error', 'error');
        };

        window.adminSetSale = async function(id) {
            const acc = accounts.find(a => a.id === id);
            if (!acc) return toast('Not found', 'error');
            const currentSale = acc.sale_price !== null && acc.sale_price !== undefined ? acc.sale_price : '';
            const input = prompt('Sale price (USD) or empty to remove:', currentSale);
            if (input === null) return;
            const salePrice = input.trim() === '' ? null : parseFloat(input);
            if (salePrice !== null && (isNaN(salePrice) || salePrice < 0)) return toast('Invalid price', 'error');
            const ok = await setSalePrice(id, salePrice);
            if (ok) { toast(salePrice !== null ? `🔥 $${salePrice}` : '✅ Removed', 'success');
                applyFilters();
                renderAdminList(); } else toast('❌ Error', 'error');
        };

        window.adminMarkSold = async function(id) {
            const acc = accounts.find(a => a.id === id);
            if (!acc) return toast('Not found', 'error');
            if (acc.sold) return toast('Already sold', 'error');
            if (!confirm(`Mark @${acc.username} as sold?`)) return;
            const ok = await markSold(id);
            if (ok) { toast(`💰 @${acc.username} sold`, 'success');
                applyFilters();
                renderAdminList();
                updateStats(); } else toast('❌ Error', 'error');
        };

        window.adminDelete = async function(id) {
            const acc = accounts.find(a => a.id === id);
            if (!acc) return toast('Not found', 'error');
            if (!confirm(`Delete @${acc.username}?`)) return;
            const ok = await deleteAccount(id);
            if (ok) { toast(`🗑️ @${acc.username} deleted`, 'success');
                applyFilters();
                renderAdminList();
                updateStats(); } else toast('❌ Error', 'error');
        };

        window.buyAccount = function(id) {
            const acc = accounts.find(a => a.id === id);
            if (!acc) return toast('Not found', 'error');
            if (acc.sold) return toast('Already sold', 'error');
            toast(`🔄 Redirecting...`, 'success');
            setTimeout(() => { window.open(REDIRECT_URL, '_blank'); }, 500);
        };

        window.checkOnX = checkOnX;

        // ============================================================
        //  SYNC
        // ============================================================
        function updateSyncUI() {
            const dot = document.getElementById('syncDot');
            const text = document.getElementById('syncText');
            const count = document.getElementById('accountCount');
            const live = accounts.filter(a => !a.sold).length;
            dot.className = 'dot' + (isConnected ? '' : ' offline');
            text.textContent = isConnected ? '✅ Online' : '❌ Offline';
            count.textContent = accounts.length + ' · ' + live + ' avail';
        }

        async function syncLoop() {
            if (syncLoopRunning) return;
            syncLoopRunning = true;
            try {
                const ok = await loadShopData();
                if (ok) {
                    const hash = accounts.map(a =>
                        a.id + ':' + a.sold + ':' + (a.sold_at || '') + ':' + a.username + ':' + a.followers + ':' + a
                        .price + ':' + (a.account_created_at || '') + ':' + (a.verified ? '1' : '0') + ':' + (a
                            .featured ? '1' : '0') + ':' + (a.sale_price ?? '')
                    ).join('|');
                    if (hash !== lastSyncHash) {
                        lastSyncHash = hash;
                        applyFilters();
                        if (adminMode) renderAdminList();
                        updateStats();
                        updateSyncUI();
                    } else {
                        updateSyncUI();
                    }
                } else {
                    updateSyncUI();
                }
            } catch (e) {
                console.error('syncLoop error:', e);
                isConnected = false;
                updateSyncUI();
            } finally {
                syncLoopRunning = false;
            }
        }

        // ============================================================
        //  INIT
        // ============================================================
        (async function init() {
            populateYearDropdown();
            await loadShopData();
            lastSyncHash = accounts.map(a =>
                a.id + ':' + a.sold + ':' + (a.sold_at || '') + ':' + a.username + ':' + a.followers + ':' + a.price +
                ':' + (a.account_created_at || '') + ':' + (a.verified ? '1' : '0') + ':' + (a.featured ? '1' : '0') +
                ':' + (a.sale_price ?? '')
            ).join('|');
            applyFilters();
            updateStats();
            updateSyncUI();

            if (sessionStorage.getItem(ADMIN_SESSION_KEY) === '1') {
                adminMode = true;
                showAdminPanel();
            }

            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    setTimeout(() => { overlay.style.display = 'none'; }, 600);
                }, 1800);
            }

            setInterval(syncLoop, SYNC_INTERVAL);

            setInterval(async () => {
                const now = ts();
                let changed = false;
                for (const acc of accounts) {
                    if (acc.sold && acc.sold_at && (now - acc.sold_at) > AUTO_DELETE_MINUTES * 60 * 1000) {
                        await deleteAccount(acc.id);
                        changed = true;
                    }
                }
                if (changed) {
                    applyFilters();
                    if (adminMode) renderAdminList();
                    updateStats();
                    updateSyncUI();
                }
            }, 30000);

            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.shiftKey && e.key === 'A') {
                    e.preventDefault();
                    toggleAdminPanel();
                }
            });

            console.log('🐦 Twitter Shop Pro v6 — چشم‌نواز و بهینه');
        })();
    </script>
</body>
</html>
